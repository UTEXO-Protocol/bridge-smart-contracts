name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        working-directory: ethereum
        run: forge fmt --check

      - name: Run Forge build
        working-directory: ethereum
        run: forge build --sizes

      - name: Verify implementation layouts and proxy selectors
        working-directory: ethereum
        run: |
          python3 script/storage-layout/test_storage-layout.py
          python3 script/storage-layout/storage_layout.py

      - name: Run Forge tests
        working-directory: ethereum
        run: forge test -vvv
